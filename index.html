<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Královské stezky – grafika</title><style>
body{margin:0;background:#17120c;color:#efe3c8;font-family:Georgia,serif}
header{position:sticky;top:0;z-index:2;background:linear-gradient(#2a1f14,#1d160e);border-bottom:1px solid #5a4329;padding:10px 12px}
h1{margin:0 0 8px;font-weight:normal;font-size:22px;color:#e8c98a;letter-spacing:.05em}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
nav button{flex:none;font:inherit;font-size:14px;padding:6px 12px;border-radius:16px;border:1px solid #6b5132;background:#2f2418;color:#efe3c8;cursor:pointer}
nav button.on{background:#d9bf8a;color:#2b1d12;border-color:#d9bf8a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:12px}
.grid.tall{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
figure{margin:0;border-radius:8px;overflow:hidden;background:#241b12;cursor:zoom-in;transition:transform .2s;box-shadow:0 2px 8px #0008}
figure:hover{transform:translateY(-3px)}
figure img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover}
.tall figure img{aspect-ratio:2/3;object-fit:contain;background:radial-gradient(circle at 50% 60%,#4a3a28,#1e160e)}
figcaption{font-size:12px;padding:5px 8px;opacity:.75}
.count{font-size:13px;opacity:.6;margin-left:6px}
#lb{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:5;flex-direction:column}
#lb.on{display:flex}#lb img{max-width:96vw;max-height:86vh;border-radius:6px}
#lb .cap{margin-top:8px;opacity:.8}#lb .nav{position:absolute;top:50%;font-size:40px;color:#fff;background:none;border:0;cursor:pointer;padding:20px}
#lb .p{left:0}#lb .n{right:0}
</style></head><body><header><h1>Královské stezky – hotová grafika<span class="count" id="tot"></span></h1><nav id="nav"></nav></header>
<div id="g" class="grid"></div><div id="lb"><button class="nav p">‹</button><img id="lbi"><div class="cap" id="lbc"></div><button class="nav n">›</button></div>
<script>const D=[{"t": "Město", "d": "img", "f": ["mesto-apatykar.webp", "mesto-banka.webp", "mesto-brana.webp", "mesto-chram.webp", "mesto-dum.webp", "mesto-hostinec.webp", "mesto-kolbiste.webp", "mesto-kovar.webp", "mesto-krejci.webp", "mesto-lazebnik.webp", "mesto-mapa.webp", "mesto-paserak.webp", "mesto-pisar.webp", "mesto-pokoj.webp", "mesto-radnice.webp", "mesto-strelmistr.webp", "mesto-trziste.webp", "mesto-vetesnik.webp", "mesto-zbrojir.webp", "mesto-zverinec.webp"]}, {"t": "Mapy oblastí", "d": "img", "f": ["mapa-kanek.webp", "mapa-lezeni.webp", "mapa-malesov.webp", "mapa-rataje.webp", "mapa-sedlec.webp"]}, {"t": "Výpravy", "d": "img/vypravy", "f": ["kanek-01.webp", "kanek-02.webp", "kanek-03.webp", "kanek-04.webp", "kanek-05.webp", "kanek-06.webp", "kanek-07.webp", "kanek-08.webp", "kanek-09.webp", "kanek-10.webp", "kanek-11.webp", "kanek-12.webp", "lezeni-01.webp", "lezeni-02.webp", "lezeni-03.webp", "lezeni-04.webp", "lezeni-05.webp", "lezeni-06.webp", "lezeni-07.webp", "lezeni-08.webp", "lezeni-09.webp", "lezeni-10.webp", "lezeni-11.webp", "lezeni-12.webp", "malesov-01.webp", "malesov-02.webp", "malesov-03.webp", "malesov-04.webp", "malesov-05.webp", "malesov-06.webp", "malesov-07.webp", "malesov-08.webp", "malesov-09.webp", "malesov-10.webp", "malesov-11.webp", "malesov-12.webp", "rataje-01.webp", "rataje-02.webp", "rataje-03.webp", "rataje-04.webp", "rataje-05.webp", "rataje-06.webp", "rataje-07.webp", "rataje-08.webp", "rataje-09.webp", "rataje-10.webp", "rataje-11.webp", "rataje-12.webp", "rataje-13.webp", "rataje-14.webp", "sedlec-01.webp", "sedlec-02.webp", "sedlec-03.webp", "sedlec-04.webp", "sedlec-05.webp", "sedlec-06.webp", "sedlec-07.webp", "sedlec-08.webp", "sedlec-09.webp", "sedlec-10.webp", "sedlec-11.webp", "sedlec-12.webp", "sedlec-13.webp", "sedlec-14.webp", "sedlec-15.webp", "sedlec-16.webp", "sedlec-17.webp", "sedlec-18.webp", "sedlec-19.webp", "sedlec-20.webp", "sedlec-21.webp", "sedlec-22.webp", "sedlec-23.webp", "sedlec-24.webp", "sedlec-25.webp", "sedlec-26.webp", "sedlec-27.webp", "sedlec-28.webp", "sedlec-29.webp", "sedlec-30.webp", "sedlec-31.webp", "sedlec-32.webp", "sedlec-33.webp", "sedlec-34.webp"]}, {"t": "Příběhy", "d": "img/pribehy", "f": ["pribeh-finale.webp", "pribeh-klaster.webp", "pribeh-kostelik.webp", "pribeh-lavka.webp", "pribeh-lis.webp", "pribeh-milir.webp", "pribeh-mlyn.webp", "pribeh-ostruvek.webp", "pribeh-prevoz.webp", "pribeh-sudy.webp", "pribeh-tabor.webp", "pribeh-ves.webp", "pribeh-vez.webp", "pribeh-vuz.webp"]}, {"t": "Situace", "d": "img/situace", "f": ["sit-boss-brana.webp", "sit-brod.webp", "sit-hadanka.webp", "sit-lov-posed.webp", "sit-lov-stopy.webp", "sit-mrtvy-poutnik.webp", "sit-navrat.webp", "sit-noc.webp", "sit-obchodnik.webp", "sit-odpocinek.webp", "sit-pad.webp", "sit-past.webp", "sit-prepadeni.webp", "sit-rybareni.webp", "sit-setkani.webp", "sit-truhla-otevrena.webp", "sit-truhla-zavrena.webp", "sit-vitezstvi.webp", "sit-zamek.webp", "sit-zaval.webp", "sit-zimni-cesta.webp", "sit-zraneny.webp"]}, {"t": "Nepřátelé", "d": "img/bytosti", "f": ["nepritel-divocak.webp", "nepritel-hlidka.webp", "nepritel-krysa.webp", "nepritel-lapka.webp", "nepritel-medved.webp", "nepritel-netopyr.webp", "nepritel-nicema.webp", "nepritel-opilec.webp", "nepritel-pacholek.webp", "nepritel-paserak.webp", "nepritel-strazny.webp", "nepritel-vlk.webp", "nepritel-zbojnik.webp", "nepritel-zbrojnos.webp", "nepritel-zlodej.webp"]}, {"t": "Bossové", "d": "img/bytosti", "f": ["boss-cerny-rytir.webp", "boss-dutohlav.webp", "boss-falesny-kat.webp", "boss-hejtman.webp", "boss-krvavy-kapitan.webp", "boss-krysar.webp", "boss-odpadly-mnich.webp", "boss-polniskudce.webp", "boss-prerostla-krysa.webp", "boss-prevoznik-kuba.webp", "boss-purkrabi-jesek.webp", "boss-rozzureny-medved.webp", "boss-vlk-zabijak.webp", "boss-vztekly-vlk.webp"]}];let cur=0,idx=0;
const nav=document.getElementById('nav'),g=document.getElementById('g'),lb=document.getElementById('lb');
document.getElementById('tot').textContent=D.reduce((s,x)=>s+x.f.length,0)+' obrázků';
D.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.t+' ('+s.f.length+')';b.onclick=()=>show(i);nav.appendChild(b)});
function show(i){cur=i;[...nav.children].forEach((b,j)=>b.classList.toggle('on',j==i));const s=D[i];
g.className='grid'+(s.d.includes('bytosti')?' tall':'');g.innerHTML='';
s.f.forEach((f,k)=>{const m=f.replace('.webp','-m.webp');const fig=document.createElement('figure');
fig.innerHTML='<img loading="lazy" src="'+s.d+'/'+m+'" alt=""><figcaption>'+f.replace('.webp','')+'</figcaption>';fig.onclick=()=>open(k);g.appendChild(fig)});scrollTo(0,0)}
function open(k){idx=k;const s=D[cur];document.getElementById('lbi').src=s.d+'/'+s.f[k];document.getElementById('lbc').textContent=s.f[k].replace('.webp','');lb.classList.add('on')}
lb.onclick=e=>{if(e.target==lb||e.target.id=='lbi')lb.classList.remove('on')};
lb.querySelector('.p').onclick=()=>open((idx-1+D[cur].f.length)%D[cur].f.length);
lb.querySelector('.n').onclick=()=>open((idx+1)%D[cur].f.length);
addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key=='Escape')lb.classList.remove('on');if(e.key=='ArrowLeft')lb.querySelector('.p').click();if(e.key=='ArrowRight')lb.querySelector('.n').click()});
show(0);</script></body></html>
