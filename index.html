<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Královské stezky – grafika</title><style>
body{margin:0;background:#17120c;color:#efe3c8;font-family:Georgia,serif}
header{position:sticky;top:0;z-index:2;background:linear-gradient(#2a1f14,#1d160e);border-bottom:1px solid #5a4329;padding:10px 12px}
h1{margin:0 0 8px;font-weight:normal;font-size:22px;color:#e8c98a;letter-spacing:.05em}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
nav button{flex:none;font:inherit;font-size:14px;padding:6px 12px;border-radius:16px;border:1px solid #6b5132;background:#2f2418;color:#efe3c8;cursor:pointer}
nav button.on{background:#d9bf8a;color:#2b1d12;border-color:#d9bf8a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:12px}
.grid.tall{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
figure{margin:0;border-radius:8px;overflow:hidden;background:#241b12;cursor:zoom-in;transition:transform .2s;box-shadow:0 2px 8px #0008}
figure:hover{transform:translateY(-3px)}
figure img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover}
.tall figure img{aspect-ratio:2/3;object-fit:contain;background:radial-gradient(circle at 50% 60%,#4a3a28,#1e160e)}
figcaption{font-size:12px;padding:5px 8px;opacity:.75}
.count{font-size:13px;opacity:.6;margin-left:6px}
#lb{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:5;flex-direction:column}
#lb.on{display:flex}#lb img{max-width:96vw;max-height:86vh;border-radius:6px}
#lb .cap{margin-top:8px;opacity:.8}#lb .nav{position:absolute;top:50%;font-size:40px;color:#fff;background:none;border:0;cursor:pointer;padding:20px}
#lb .p{left:0}#lb .n{right:0}
#lb .box{position:relative;overflow:hidden;border-radius:6px;max-width:96vw;max-height:80vh}
#lb .box img{display:block;max-width:96vw;max-height:80vh;border-radius:0}
#lb.scene .box img{animation:kb 30s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.07) translate(-1%,-1%)}}
#lb.being .box{background:radial-gradient(circle at 50% 62%,#5a4630,#1a130c)}
#lb.being .box img{transform-origin:50% 92%;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.018) scaleX(.995)}}
#lb .ov{position:absolute;inset:0;pointer-events:none}
#lb .night{background:linear-gradient(#0a1230,#140a1c);mix-blend-mode:multiply;opacity:0;transition:opacity 2.5s}
#lb.eve .night{opacity:.6}
#lb .vig{box-shadow:inset 0 0 120px 30px #000a}
#lb canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#lb .tools{display:flex;gap:8px;margin-top:8px}
#lb .tools button{font:inherit;font-size:14px;padding:6px 12px;border-radius:6px;border:1px solid #8a6a3a;background:linear-gradient(#f3e3bf,#d9bf8a);color:#2b1d12;cursor:pointer}
</style></head><body><header><h1>Královské stezky – hotová grafika<span class="count" id="tot"></span></h1><nav id="nav"></nav></header>

function open(k){idx=k;W=0;P=[];const bt=D[cur].d.includes('bytosti')||D[cur].d.includes('postava');lb.classList.toggle('being',bt);lb.classList.toggle('scene',!bt);const s=D[cur];document.getElementById('lbi').src=s.d+'/'+s.f[k];document.getElementById('lbc').textContent=s.f[k].replace('.webp','');lb.classList.add('on')}
